services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - .env # or ../.env depending on your folder structure
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASS}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - NODE_ENV=production
      - GENERIC_TIMEZONE=America/New_York
      
      # --- NETWORK CONFIGURATION ---
      - N8N_PORT=5678
      - N8N_HOST=agent.automate.qzz.io
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://agent.automate.qzz.io/
      # Only needed if n8n complains about behind proxy
      - N8N_PROXY_HOPS=1 
      
    volumes:
      - ./data:/home/node/.n8n
    networks:
      - homelab_net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${N8N_CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true