name: personal-immich
services:
  immich-server:
    container_name: personal-immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - "2283:2283" 
    depends_on:
      - redis
      - database
    restart: "no"
    networks:
      - proxy_net   
      - db_int_net  
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  immich-machine-learning:
    container_name: personal-immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: "no"
    networks:
      - db_int_net 
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M 
    profiles:
      - ml 

  redis:
    container_name: personal-immich_redis
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: "no"
    networks:
      - db_int_net 
    deploy:
      resources:
        limits:
          memory: 128M

  database:
    container_name: personal-immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${IMMICH_POSTGRES_PASSWORD}
      POSTGRES_USER: ${IMMICH_POSTGRES_USER}
      POSTGRES_DB: ${IMMICH_POSTGRES_DB}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${IMMICH_DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: "no"
    networks:
      - db_int_net 
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  model-cache:

networks:
  proxy_net:
    external: true
  db_int_net:
    external: true

# Start WITHOUT machine learning (saves 1GB+ RAM)
# docker compose up -d

# Later if you want face recognition:
# docker compose --profile ml up -d