name: apps-files
services:
  samba-server:
    container_name: apps-files_server
    image: ghcr.io/servercontainers/samba:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      ACCOUNT_${SMB_USER}: ${SMB_PASSWORD}
      UID_${SMB_USER}: 1000
      # Changed from personalstorage to Vault
      SAMBA_VOLUME_CONFIG_Vault: |
        [Vault]
        path = /shares/Vault
        valid users = ${SMB_USER}
        guest ok = no
        browseable = yes
        read only = no

    volumes:
      - ${SMB_STORAGE_LOCATION}:/shares/Vault
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "139:139"
      - "445:445"
    networks:
      - web-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  web-network:
    external: true
