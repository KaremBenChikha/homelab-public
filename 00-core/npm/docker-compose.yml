name: infra-proxy
services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: infra-proxy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'


    environment:
      DISABLE_IPV6: 'true'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - web-network

networks:
  web-network:
    external: true