name: infra-docker
services:
  portainer:
    container_name: infra-docker
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data
    networks:
      - web-network

networks:
  web-network:
    external: true