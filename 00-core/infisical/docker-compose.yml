services:
  infisical-db:
    container_name: infisical-db
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-infisical}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-infisical_postgres_password}
      POSTGRES_DB: ${DB_NAME:-infisical}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - proxy_net

  infisical-redis:
    container_name: infisical-redis
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    networks:
      - proxy_net

  infisical:
    container_name: infisical
    image: infisical/infisical:latest
    restart: unless-stopped
    depends_on:
      - infisical-db
      - infisical-redis
    environment:
      - NODE_ENV=production
      - DB_CONNECTION_URI=postgres://${DB_USER:-infisical}:${DB_PASSWORD:-infisical_postgres_password}@infisical-db:5432/${DB_NAME:-infisical}
      - REDIS_URL=redis://infisical-redis:6379
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - SITE_URL=https://secrets.yourdomain.com
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true