name: core-tunnel

services:
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: core-tunnel
    restart: unless-stopped
    env_file:
      - .env
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
