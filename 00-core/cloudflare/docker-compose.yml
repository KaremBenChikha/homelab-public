name: infra-tunnel

services:
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: infra-tunnel
    restart: unless-stopped
    env_file:
      - .env
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    networks:
      - web-network

networks:
  web-network:
    external: true
