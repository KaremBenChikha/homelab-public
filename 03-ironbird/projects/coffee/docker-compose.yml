name: ironbird-coffee
services:
  web:
    image: nginx:alpine
    container_name: ironbird-coffee-web
    restart: "no"
    env_file: ./.env.example
    volumes:
      - ./src:/usr/share/nginx/html
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - homelab_net
    ports:
      - "${WEB_PORT}:80"

networks:
  homelab_net:
    external: true
