version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: ${PROJECT_NAME}_web
    restart: unless-stopped
    env_file: ./.env.example
    volumes:
      - ./src:/usr/share/nginx/html
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - homelab_net
    ports:
      - "${WEB_PORT}:80"

networks:
  homelab_net:
    external: true
