services:
  app:
    container_name: filestash
    image: machines/filestash:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - GD_NO_WIPE_MNT=true
    ports:
      - "8334:8334"
    volumes:
      - filestash_config:/app/data/state

      - ${STORAGE_ROOT}:/mnt/data
    networks:
      - homelab_net
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  filestash_config:

networks:
  homelab_net:
    external: true