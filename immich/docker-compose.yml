# immich-compose.yml
name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload # Changed target path (more standard Immich setup)
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    depends_on:
      - redis
      - database
    restart: always
    networks:
      - homelab_net # FOR NPM ACCESS
      - immich_backend # FOR DATABASE/REDIS ACCESS
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    networks:
      - immich_backend # ONLY needs backend access
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    networks:
      - immich_backend # ISOLATED
    deploy:
      resources:
        limits:
          memory: 256M

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${IMMICH_POSTGRES_PASSWORD}
      POSTGRES_USER: ${IMMICH_POSTGRES_USER}
      POSTGRES_DB: ${IMMICH_POSTGRES_DB}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${IMMICH_DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: always
    networks:
      - immich_backend # ISOLATED
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  model-cache:

networks:
  homelab_net:
    external: true
  immich_backend: # NEW ISOLATED NETWORK
    driver: bridge 
    internal: true # Optional: Prevents communication outside the host