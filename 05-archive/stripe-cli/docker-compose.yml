name: infra-payments
services:
  stripe-cli:
    container_name: infra-payments
    image: stripe/stripe-cli
    command: listen --forward-to http://pulse-api:3000/api/webhooks/stripe --api-key ${STRIPE_SECRET_KEY}
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    networks:
      - web-network
    restart: unless-stopped

networks:
  web-network:
    external: true
